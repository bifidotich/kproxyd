# Сборка и публикация релизов.
#   пуш в main  -> плавающий пре-релиз «latest» (перезаписывается каждой сборкой)
#   метка v*    -> неизменяемый релиз этой версии
# Установка на роутере берёт файлы отсюда: scripts/install.sh.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# сборки одной ветки/метки идут по очереди: иначе в релизе смешались бы файлы разных коммитов
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false  # внешних зависимостей нет

      - name: Проверки
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "нужен gofmt"; exit 1; }
          go vet ./...
          for f in build.sh scripts/install.sh scripts/uninstall.sh scripts/S99kproxyd; do sh -n "$f"; done

      - name: Сборка
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" sh ./build.sh
          mkdir release
          cp dist/kproxyd-* scripts/S99kproxyd scripts/install.sh scripts/uninstall.sh release/
          # install.sh из релиза версии по умолчанию ставит именно эту версию
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            sed -i "s/^DEFAULT_VERSION=latest\$/DEFAULT_VERSION=$VERSION/" release/install.sh
            grep -q "^DEFAULT_VERSION=$VERSION\$" release/install.sh
          fi
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Публикация latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          NOTES="Сборка из main, коммит ${GITHUB_SHA}. Обновляется при каждом пуше.

          Установка и обновление на роутере:
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/install.sh | sh"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber
            gh release edit latest --prerelease --title "latest ($VERSION)" --notes "$NOTES"
          else
            gh release create latest release/* --prerelease --title "latest ($VERSION)" --notes "$NOTES"
          fi

      - name: Публикация версии
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Установка этой версии на роутере:
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/install.sh | sh"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
          else
            gh release create "$VERSION" release/* --title "$VERSION" --notes "$NOTES"
          fi
